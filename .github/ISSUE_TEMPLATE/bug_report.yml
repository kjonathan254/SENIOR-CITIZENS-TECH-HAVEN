name: Bug report
description: Something is broken on the site or in the repo
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report this. Clear details help us fix it faster.
  - type: input
    id: url
    attributes:
      label: Page URL
      description: Where did this happen?
      placeholder: https://seniorcitizenstechhaven.netlify.app/...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Content (text, guides, facts)
        - Layout / styling
        - JavaScript behaviour (menu, FAQ, filters, Elsah chat)
        - Broken link or image
        - Performance
        - Accessibility
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      placeholder: e.g. Android phone, Chrome; or Windows, Firefox
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Drag images here, or paste any red errors from the browser console (F12).
