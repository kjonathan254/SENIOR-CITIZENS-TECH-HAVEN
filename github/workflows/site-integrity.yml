name: Site Integrity

# Runs on every push/PR. NO deploy job here — Netlify deploys main automatically.
# This pipeline only VERIFIES, so a red X means "do not ship".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (rate limiting, sensitive-data detection)
        run: npm test

      - name: CSP coverage — every inline script/handler must be hash-allowlisted
        run: python3 scripts/ci/check_csp.py

      - name: Site integrity — links, images, JSON-LD, canonical, sitemap
        run: python3 scripts/ci/check_site.py

      - name: Secret scan
        run: python3 scripts/ci/check_secrets.py

      - name: Sensitive files must not be tracked
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked in git"; exit 1
          fi
          if git ls-files | grep -qE '^node_modules/'; then
            echo "::error::node_modules is tracked in git"; exit 1
          fi
          echo "OK: no sensitive files tracked"
